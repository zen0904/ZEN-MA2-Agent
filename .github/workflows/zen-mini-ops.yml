name: ZEN Mini Ops

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  mini-ops:
    if: >
      startsWith(github.event.issue.title, '[ZEN-OPS]')
      && github.event.issue.user.login == github.repository_owner
    runs-on: [self-hosted, linux, x64, zen-mini]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Execute allowlisted Mini operation
        id: ops
        env:
          ZEN_OPS_BODY: ${{ github.event.issue.body }}
        run: |
          python3 scripts/zen_mini_ops.py --body "$ZEN_OPS_BODY" > /tmp/zen-mini-ops-result.txt 2>&1

      - name: Post result
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const p = '/tmp/zen-mini-ops-result.txt';
            let body = fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : 'No result file was produced.';
            if (body.length > 60000) body = body.slice(0, 60000) + '\n\n[truncated]';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '### ZEN Mini Ops result\n\n```text\n' + body + '\n```'
            });
